name: Build OrangeFox Recovery for RMX3388

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'device/realme/RMX3388/**'
      - '.github/workflows/build_orangefox.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show available build space
        run: |
          df -h "$RUNNER_TEMP"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.bin/repo"
          chmod a+rx "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Fetch OrangeFox sync script
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/orangefox-sync"

      - name: Sync OrangeFox fox_12.1 sources
        run: |
          cd "$RUNNER_TEMP/orangefox-sync"
          ./orangefox_sync.sh --branch 12.1 --path "$RUNNER_TEMP/orangefox"

      - name: Add RMX3388 device tree
        run: |
          mkdir -p "$RUNNER_TEMP/orangefox/device/realme"
          cp -a "$GITHUB_WORKSPACE/device/realme/RMX3388" "$RUNNER_TEMP/orangefox/device/realme/"

      - name: Ensure build swap
        run: |
          current_swap_kb=$(awk 'NR > 1 { total += $3 } END { print total + 0 }' /proc/swaps)
          if [ "$current_swap_kb" -lt 8388608 ]; then
            sudo fallocate -l 8G "$RUNNER_TEMP/orangefox-build.swap"
            sudo chmod 600 "$RUNNER_TEMP/orangefox-build.swap"
            sudo mkswap "$RUNNER_TEMP/orangefox-build.swap"
            sudo swapon "$RUNNER_TEMP/orangefox-build.swap"
          fi
          free -h
          swapon --show

      - name: Build OrangeFox recovery
        shell: bash
        run: |
          cd "$RUNNER_TEMP/orangefox"
          exec > >(tee -a "$RUNNER_TEMP/orangefox-build.log") 2>&1
          export FOX_BUILD_DEVICE=RMX3388
          export FOX_VANILLA_BUILD=1
          export OF_SCREEN_H=2400
          export OF_FORCE_PREBUILT_KERNEL=1
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          echo "Sourcing OrangeFox build environment"
          set +e
          source build/envsetup.sh
          envsetup_status=$?
          set -e
          if ! declare -F lunch >/dev/null; then
            echo "envsetup.sh did not define lunch (exit $envsetup_status)" >&2
            exit 1
          fi
          if ! declare -F mka >/dev/null; then
            echo "envsetup.sh did not define mka (exit $envsetup_status)" >&2
            exit 1
          fi
          echo "OrangeFox build environment loaded (source exit $envsetup_status)"
          lunch twrp_RMX3388-eng
          echo "Lunch target selected"
          set -o pipefail
          mka -j1 adbd recoveryimage

      - name: Validate and stage OrangeFox image
        run: |
          image="$RUNNER_TEMP/orangefox/out/target/product/RMX3388/recovery.img"
          test -s "$image"
          size=$(stat -c '%s' "$image")
          test "$size" -le 134217728
          python3 - "$image" <<'PY'
          import gzip
          import struct
          import sys

          image_path = sys.argv[1]
          image = open(image_path, "rb").read()
          if image[:8] != b"ANDROID!":
              raise SystemExit("Invalid Android boot image magic")

          kernel_size = struct.unpack_from("<I", image, 8)[0]
          ramdisk_size = struct.unpack_from("<I", image, 16)[0]
          page_size = struct.unpack_from("<I", image, 36)[0]
          header_version = struct.unpack_from("<I", image, 40)[0]
          if header_version != 2 or page_size == 0:
              raise SystemExit(f"Expected boot header v2, got v{header_version}")

          align = lambda value: (value + page_size - 1) // page_size * page_size
          ramdisk_offset = page_size + align(kernel_size)
          ramdisk_end = ramdisk_offset + ramdisk_size
          if ramdisk_end > len(image):
              raise SystemExit("Ramdisk extends beyond recovery image")

          ramdisk = gzip.decompress(image[ramdisk_offset:ramdisk_end])
          offset = 0
          found = False
          trailer = False
          while offset + 110 <= len(ramdisk):
              header = ramdisk[offset:offset + 110]
              if header[:6] not in (b"070701", b"070702"):
                  raise SystemExit(f"Invalid CPIO header at offset {offset}")
              fields = [int(header[i:i + 8], 16) for i in range(6, 110, 8)]
              file_size, name_size = fields[6], fields[11]
              offset += 110
              if name_size < 1 or offset + name_size > len(ramdisk):
                  raise SystemExit("Invalid CPIO filename size")
              name = ramdisk[offset:offset + name_size - 1].decode("utf-8", "replace")
              offset = (offset + name_size + 3) & ~3
              if offset + file_size > len(ramdisk):
                  raise SystemExit(f"Truncated CPIO entry: {name}")
              offset = (offset + file_size + 3) & ~3
              if name == "init.recovery.mt6833.rc":
                  found = True
              if name == "TRAILER!!!":
                  trailer = True
                  break

          if not trailer:
              raise SystemExit("CPIO archive has no trailer")
          if not found:
              raise SystemExit("MT6833 recovery init script missing from ramdisk")
          print("MT6833 recovery init script is present in ramdisk")
          PY
          mkdir -p "$RUNNER_TEMP/orangefox-artifacts"
          cp "$image" "$RUNNER_TEMP/orangefox-artifacts/OrangeFox-RMX3388.img"
          sha256sum "$image" | tee "$RUNNER_TEMP/orangefox-artifacts/OrangeFox-RMX3388.sha256"
          echo "OrangeFox image size: $size bytes"

      - name: Preserve build log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/orangefox-artifacts"
          if [ -f "$RUNNER_TEMP/orangefox-build.log" ]; then
            cp "$RUNNER_TEMP/orangefox-build.log" "$RUNNER_TEMP/orangefox-artifacts/"
          fi

      - name: Upload OrangeFox build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-RMX3388-${{ github.run_number }}
          path: ${{ runner.temp }}/orangefox-artifacts/
          if-no-files-found: ignore
          retention-days: 90
